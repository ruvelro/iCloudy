name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and localization
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift-format --version
      - name: swift-format
        # Rule findings fail; layout findings are counted only (see scripts/lint.sh and .swift-format).
        run: scripts/lint.sh
      - name: Plural tables are generated from scripts/make-plurals.py
        run: |
          python3 scripts/make-plurals.py
          git diff --exit-code Resources
      - name: No new orphan keys in the English table
        run: python3 scripts/check-localization.py --baseline scripts/localization-orphans.txt

  test:
    name: Test (${{ matrix.os }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest macOS the app declares. Its image defaults to Xcode 15.4, which cannot read
          # swift-tools-version 6.0, so the newest Xcode 16 it carries is pinned instead.
          - os: macos-14
            xcode: "16.2"
            integration: false
          # Pinned, not "the newest installed": a toolchain that changes by itself makes failures unreproducible.
          - os: macos-15
            xcode: "16.4"
            integration: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      # A crash prints its backtrace in the log instead of only "unexpected signal".
      SWIFT_BACKTRACE: enable=yes,style=full,interactive=no
      # Per-test watchdog (Tests/iCloudyTests/TestSupport.swift); generous for a loaded runner.
      ICLOUDY_TEST_TIMEOUT: "300"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::Xcode ${{ matrix.xcode }} is not installed on ${{ matrix.os }}. Installed:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          xcodebuild -version
          swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          # The build folder depends on the toolchain as much as on the sources. restore-keys reuses the closest
          # earlier build, so a push rebuilds only what it changed.
          key: build-${{ matrix.os }}-xcode${{ matrix.xcode }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            build-${{ matrix.os }}-xcode${{ matrix.xcode }}-
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Integration servers
        # MinIO, OpenSSH and pyftpdlib run inside the job, so the S3, SFTP and FTPS integration tests stop skipping.
        # A server that fails to start falls back to the repository secret of the same name, if there is one.
        if: matrix.integration
        env:
          SECRET_S3_URL: ${{ secrets.ICLOUDY_S3_URL }}
          SECRET_SFTP_URL: ${{ secrets.ICLOUDY_SFTP_URL }}
          SECRET_FTPS_URL: ${{ secrets.ICLOUDY_FTPS_URL }}
        run: |
          fallback() {
            local name="$1" secret="$2"
            echo "::warning::The local server for $name did not start."
            if [[ -n "$secret" ]]; then echo "::add-mask::$secret"; echo "$name=$secret" >> "$GITHUB_ENV"; echo "Using the $name secret."; fi
          }
          scripts/ci/minio.sh start || fallback ICLOUDY_S3_URL "$SECRET_S3_URL"
          scripts/ci/sftp.sh start || fallback ICLOUDY_SFTP_URL "$SECRET_SFTP_URL"
          scripts/ci/ftps.sh start || fallback ICLOUDY_FTPS_URL "$SECRET_FTPS_URL"
      - name: Test
        run: swift test --parallel --enable-code-coverage
      - name: Coverage
        if: success() || failure()
        run: scripts/ci/coverage.sh coverage.lcov
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: coverage-${{ matrix.os }}-xcode${{ matrix.xcode }}
          path: coverage.lcov
          if-no-files-found: ignore
          retention-days: 14
      - name: Crash reports
        # A test process that crashes leaves only "unexpected signal" in the log; the system's report says where.
        if: failure()
        run: |
          sleep 20
          ls -lt ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports 2>/dev/null | head -20
          for report in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips /Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -2); do
            echo "== $report"; head -c 60000 "$report"; echo
          done
      - name: Server logs
        if: failure() && matrix.integration
        run: |
          root="${RUNNER_TEMP}/icloudy-ci"
          for log in "$root/minio/minio.log" "$root/sftp/sshd.log" "$root/ftps/server.log"; do
            [[ -f "$log" ]] && { echo "== $log"; sudo tail -n 200 "$log"; }
          done
          true
      - name: Stop servers
        if: always() && matrix.integration
        run: |
          scripts/ci/minio.sh stop || true
          scripts/ci/sftp.sh stop || true
          scripts/ci/ftps.sh stop || true

  bundle:
    name: Release build and bundles
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Strict concurrency
        run: swift build -c release -Xswiftc -strict-concurrency=complete
      - name: Bundle
        # Builds the .app with the example OAuth configuration and an ad hoc signature, and checks it is well formed.
        run: |
          ICLOUDY_BUILD_CONFIGURATION=debug bash scripts/build-app.sh
          plutil -lint dist/debug/iCloudy.app/Contents/Info.plist
          codesign --verify --deep --strict dist/debug/iCloudy.app
          test ! -e dist/debug/iCloudy.app/Contents/PlugIns
      - name: Bundle with the File Provider extension
        # The extension is only packaged when an App Group is named. A made-up group cannot load on a Mac without a
        # matching provisioning profile, but it exercises the packaging, the entitlements and the signatures.
        env:
          ICLOUDY_BUILD_CONFIGURATION: debug
          ICLOUDY_APP_GROUP: group.dev.icloudy.ci
        run: |
          bash scripts/build-app.sh
          appex=dist/debug/iCloudy.app/Contents/PlugIns/iCloudyFileProvider.appex
          plutil -lint "$appex/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :iCloudyAppGroup' "$appex/Contents/Info.plist")" = "$ICLOUDY_APP_GROUP"
          codesign --verify --deep --strict dist/debug/iCloudy.app
          codesign -d --entitlements :- "$appex" | grep -q "$ICLOUDY_APP_GROUP"
